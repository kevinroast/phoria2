name: Publish

# Publish to npm when a version tag is pushed: `git tag v1.0.0-rc.2 && git push origin v1.0.0-rc.2`.
# npm's trusted publishing signs in with this workflow's GitHub identity - no npm token is stored
# anywhere - and attaches provenance, so npmjs.com shows which commit and workflow built each
# release. Set up once on npmjs.com: the package's Settings > Trusted publisher > GitHub Actions,
# with this repository and the workflow file name publish.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # lets npm sign in as this workflow, and sign the provenance
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10
      - run: npm install -g npm@^11.5.1
      # the tag must name the version in package.json, so a typo can't publish the wrong thing
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs lint, typecheck, tests and the build before anything is uploaded.
      # Release candidates (versions with a '-', like 1.0.0-rc.2) go out as 'next', so
      # `npm install phoria2` keeps the last full release; full releases go out as 'latest'.
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --provenance --access public --tag "$tag"
